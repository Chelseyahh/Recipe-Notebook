<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title> 
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="notebook-wrapper">
        <div class="notebook-card">
            <h1>✨Add a Recipe✨</h1>
            <form id="recipe-form" action="list/list.html" method="post">
                <div class="field-group">
                    <label for="recipe-name">Recipe Name✨</label>
                    <input type="text" id="recipe-name" name="recipe_name" placeholder="e.g. Strawberry Tart">    
                </div>
                <div class="field-group">
                    <label for="ingredients">Ingredients🥘</label>
                    <textarea id="ingredients" name="recipe_ingredients" placeholder="List your ingredients here..."></textarea>
                </div>
                <div class="field-group">
                    <label for="instructions">Instructions🗒️</label>
                    <textarea id="instructions" name="recipe-instructions" placeholder="Step-by-Step instructions"></textarea>
                </div>
                <button type="submit">Add Recipe✨</button>
                <a href="list/list.html" class="view-recipes-link">View My Recipes →</a>
            </form>
        </div>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
